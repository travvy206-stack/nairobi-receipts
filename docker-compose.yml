version: '3.8'

services:
  nta-pay:
    build: .
    image: nta-pay:latest
    container_name: nta-pay-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MPESA_ENV=sandbox
      - MPESA_SHORTCODE=174379
      - MPESA_PASSKEY=bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919
      - MPESA_CALLBACK_URL=https://example.com/api/mpesa_callback.php
      - PDF_SERVICE_URL=http://127.0.0.1:5000
    volumes:
      - nta_data:/var/www/html/db
      - nta_storage:/var/www/html/service_pdf/storage

volumes:
  nta_data:
  nta_storage:
