[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:python_pdf]
command=/opt/venv/bin/python /var/www/html/service_pdf/app.py
directory=/var/www/html/service_pdf
autostart=true
autorestart=true
stderr_logfile=/var/log/python_pdf.err.log
stdout_logfile=/var/log/python_pdf.out.log
environment=FLASK_ENV="production"

[program:php_web]
command=sh -c "php -S 0.0.0.0:${PORT:-8000} -t /var/www/html/public"
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/php_web.err.log
stdout_logfile=/var/log/php_web.out.log
